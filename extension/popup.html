<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#86868b;--border:rgba(0,0,0,.08);--accent:#0071e3}
*{box-sizing:border-box;margin:0;padding:0}
body{width:280px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--text);padding:16px}
h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#2997ff,#0071e3);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.stat{display:flex;gap:8px;margin-bottom:14px}
.stat div{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;text-align:center;padding:10px 4px}
.stat b{display:block;font-size:17px;font-weight:800}
.stat span{font-size:10.5px;color:var(--muted)}
button{width:100%;padding:10px;border:none;border-radius:12px;background:linear-gradient(135deg,#2997ff,#0071e3);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.08)}
.tip{font-size:10.5px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<h1><span class="logo">N</span>My Nav</h1>
<div class="sub" id="sub">正在读取书签…</div>
<div class="stat" id="stat" style="display:none">
  <div><b id="nAll">0</b><span>有效书签</span></div>
  <div><b id="nDup" style="color:#f59e0b">0</b><span>重复</span></div>
  <div><b id="nInv" style="color:#e11d48">0</b><span>无效</span></div>
</div>
<button id="open">打开导航新标签页</button>
<div class="tip">新标签页已接管为 My Nav<br>整理功能请点导航页右上角「整理」</div>
<script src="js/classifier.js"></script>
<script src="js/popup.js"></script>
</body>
</html>
